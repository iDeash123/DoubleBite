[project]
name = "double-bite"
version = "0.1.0"
description = "Double Bite restaurant and delivery platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0",
    "django-allauth[socialaccount]>=65.19.4",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0.1",
    "redis>=5.0.0",
    "stripe>=7.0.0",
    "uvicorn[standard]>=0.30.0",
    "whitenoise>=6.7",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "pytest>=8.0",
    "pytest-django>=4.9",
    "ruff>=0.16.7",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    "**/migrations/*",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "BLE",
    "S",
]
ignore = [
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = ["S101", "S105", "S106", "S107"]
"double-bite/tests_e2e/*.py" = ["S101", "S105", "S106", "S107"]
"double-bite/support/tests/test_chat_markdown.py" = ["S603"]
"double-bite/config/tests/test_security_settings.py" = ["S603"]
