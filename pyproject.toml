[project]
name = "double-bite"
version = "0.1.0"
description = "Double Bite restaurant and delivery platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0",
    "django-allauth[socialaccount]>=65.19.4",
    "mistralai>=1.5.0",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0.1",
    "redis>=5.0.0",
    "stripe>=7.0.0",
    "uvicorn[standard]>=0.30.0",
    "whitenoise>=6.7",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "pytest>=8.0",
    "pytest-django>=4.9",
    "ruff>=0.16.7",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    "**/migrations/*",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "S104",
    "S310",
    "S314",
    "S603",
    "S607",
]
ignore = [
    "RUF012",
    "BLE001",
    "S110",
]

# Staged cleanup plan (slices V1-V5) removes these temporary per-file ignores:
# - V1: accounts/views.py, accounts/forms.py, accounts/selectors.py
# - V2: menu/* (including seed_db.py S310 & test_seo.py S314)
# - V3: orders/*
# - V4: support/* (including vector_search.py B905, test_agent.py B904, test_chat_markdown.py S603/S607)
# - V5: enable full "S" group and remove global BLE001/S110 ignores
[tool.ruff.lint.per-file-ignores]
"double-bite/support/agent/client.py" = ["E501"]
"double-bite/support/agent/prompts.py" = ["E501"]
"double-bite/support/agent/tools.py" = ["E501"]
"double-bite/support/emails.py" = ["E501"]
"double-bite/support/views.py" = ["E501"]
"double-bite/support/vector_search.py" = ["B905"]
"double-bite/support/tests/test_agent.py" = ["B904"]
"double-bite/support/tests/test_chat_markdown.py" = ["E501", "S603", "S607"]
"double-bite/config/tests/test_security_settings.py" = ["S603"]
