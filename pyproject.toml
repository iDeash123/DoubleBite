[project]
name = "double-bite"
version = "0.1.0"
description = "Double Bite restaurant and delivery platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0",
    "django-allauth[socialaccount]>=65.19.4",
    "mistralai>=1.5.0",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0.1",
    "redis>=5.0.0",
    "stripe>=7.0.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "pytest>=8.0",
    "pytest-django>=4.9",
    "ruff>=0.16.7",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    "**/migrations/*",
    ".venv",
]

[tool.ruff.lint]
ignore = [
    "RUF012",
    "BLE001",
    "S110",
]
