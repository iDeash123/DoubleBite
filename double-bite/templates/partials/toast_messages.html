<script nonce="{{ csp_nonce }}">
window.showToast = function(message, type, timeout) {
  window.dispatchEvent(new CustomEvent('show-toast', {
    detail: {
      message: message,
      type: type || 'info',
      timeout: typeof timeout === 'number' ? timeout : 4500
    }
  }));
};
</script>
<div
  id="toast-notifications-container"
  x-data="{
    toasts: [
      {% if messages %}
        {% for message in messages %}
          {
            id: 'toast-srv-{{ forloop.counter }}-' + Math.random().toString(36).slice(2, 9),
            message: '{{ message|escapejs }}',
            type: '{{ message.tags|default:'info'|escapejs }}',
            timeout: 4500,
            remaining: 4500,
            timer: null,
            startedAt: null
          }{% if not forloop.last %},{% endif %}
        {% endfor %}
      {% endif %}
    ],
    init() {
      this.toasts.forEach(t => this.startTimer(t));
    },
    startTimer(toast) {
      if (!toast || toast.timeout <= 0) return;
      if (toast.timer) clearTimeout(toast.timer);
      toast.startedAt = Date.now();
      const delay = toast.remaining !== undefined ? toast.remaining : toast.timeout;
      toast.timer = setTimeout(() => {
        this.removeToast(toast.id);
      }, delay);
    },
    pause(toast) {
      if (!toast || !toast.timer) return;
      clearTimeout(toast.timer);
      toast.timer = null;
      const elapsed = Date.now() - (toast.startedAt || Date.now());
      const rem = toast.remaining !== undefined ? toast.remaining : toast.timeout;
      toast.remaining = Math.max(500, rem - elapsed);
    },
    resume(toast) {
      if (!toast || toast.timer || (toast.remaining !== undefined && toast.remaining <= 0)) return;
      this.startTimer(toast);
    },
    pauseToast(toast) {
      this.pause(toast);
    },
    resumeToast(toast) {
      this.resume(toast);
    },
    addToast(detail) {
      let message = '';
      let type = 'info';
      let timeout = 4500;
      if (typeof detail === 'string') {
        message = detail;
      } else if (detail && typeof detail === 'object') {
        message = detail.message || detail.text || '';
        type = detail.type || detail.tags || detail.level || 'info';
        if (detail.timeout !== undefined) {
          timeout = Number(detail.timeout);
        }
      }
      if (!message) return;
      const id = 'toast-' + Date.now() + '-' + Math.random().toString(36).slice(2, 9);
      const toast = {
        id: id,
        message: message,
        type: type,
        timeout: timeout,
        remaining: timeout,
        timer: null,
        startedAt: null
      };
      this.toasts.push(toast);
      this.startTimer(toast);
    },
    removeToast(id) {
      const toast = this.toasts.find(t => t.id === id);
      if (toast && toast.timer) {
        clearTimeout(toast.timer);
      }
      this.toasts = this.toasts.filter(t => t.id !== id);
    },
    getToastClasses(type) {
      const t = (type || '').toLowerCase();
      if (t.includes('error')) {
        return 'border-l-4 border-l-red-600';
      }
      if (t.includes('warning')) {
        return 'border-l-4 border-l-amber-500';
      }
      if (t.includes('success')) {
        return 'border-l-4 border-l-emerald-600';
      }
      return 'border-l-4 border-l-db-crust-dark';
    },
    getTypeBadge(type) {
      const t = (type || '').toLowerCase();
      if (t.includes('error')) {
        return { label: 'Помилка', dot: 'bg-red-600', badge: 'text-red-700 bg-red-50 border-red-200' };
      }
      if (t.includes('warning')) {
        return { label: 'Увага', dot: 'bg-amber-600', badge: 'text-amber-800 bg-amber-50 border-amber-200' };
      }
      if (t.includes('success')) {
        return { label: 'Успішно', dot: 'bg-emerald-600', badge: 'text-emerald-800 bg-emerald-50 border-emerald-200' };
      }
      return { label: 'Інфо', dot: 'bg-db-crust-dark', badge: 'text-db-text bg-db-boucle border-db-linen' };
    }
  }"
  @show-toast.window="addToast($event.detail)"
  @toast.window="addToast($event.detail)"
  class="fixed top-20 sm:top-24 right-4 sm:right-6 z-50 flex flex-col gap-2.5 w-[calc(100vw-2rem)] sm:w-full max-w-sm pointer-events-none"
  aria-live="polite"
>
  <template x-for="toast in toasts" :key="toast.id">
    <div
      @mouseenter="pause(toast)"
      @mouseleave="resume(toast)"
      x-transition:enter="transition ease-out duration-200 transform"
      x-transition:enter-start="opacity-0 -translate-y-2 sm:translate-y-0 sm:translate-x-4 scale-95"
      x-transition:enter-end="opacity-100 translate-y-0 sm:translate-x-0 scale-100"
      x-transition:leave="transition ease-in duration-150 transform"
      x-transition:leave-start="opacity-100 translate-y-0 sm:translate-x-0 scale-100"
      x-transition:leave-end="opacity-0 -translate-y-2 sm:translate-y-0 sm:translate-x-4 scale-95"
      class="pointer-events-auto bg-white border border-db-linen rounded-xl p-4 shadow-lg"
      :class="getToastClasses(toast.type)"
      role="alert"
    >
      <div class="flex items-center justify-between gap-2 pb-2 mb-2 border-b border-db-linen/70">
        <div class="flex items-center gap-2">
          <span :class="getTypeBadge(toast.type).dot" class="w-2 h-2 rounded-full inline-block shrink-0" aria-hidden="true"></span>
          <span :class="getTypeBadge(toast.type).badge" class="text-xs font-sans font-medium px-2 py-0.5 border rounded-md" x-text="getTypeBadge(toast.type).label"></span>
        </div>
        <button
          type="button"
          @click="removeToast(toast.id)"
          class="min-w-[32px] min-h-[32px] -mr-1.5 -mt-1 inline-flex items-center justify-center rounded-lg text-db-subtle hover:text-db-text hover:bg-db-boucle transition-colors cursor-pointer"
          aria-label="Закрити"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="text-sm font-sans text-db-text leading-relaxed break-words" x-text="toast.message"></div>
    </div>
  </template>
  <noscript>
    {% if messages %}
      <div class="space-y-2 pointer-events-auto">
        {% for message in messages %}
          <div class="pointer-events-auto bg-white border border-db-linen rounded-xl p-4 shadow-lg text-db-text {% if 'error' in message.tags %}border-l-4 border-l-red-600{% elif 'warning' in message.tags %}border-l-4 border-l-amber-500{% elif 'success' in message.tags %}border-l-4 border-l-emerald-600{% else %}border-l-4 border-l-db-crust-dark{% endif %}" role="alert">
            <div class="flex items-center justify-between pb-2 mb-2 border-b border-db-linen/70">
              <span class="text-xs font-sans font-medium px-2 py-0.5 border rounded-md {% if 'error' in message.tags %}text-red-700 bg-red-50 border-red-200{% elif 'warning' in message.tags %}text-amber-800 bg-amber-50 border-amber-200{% elif 'success' in message.tags %}text-emerald-800 bg-emerald-50 border-emerald-200{% else %}text-db-text bg-db-boucle border-db-linen{% endif %}">
                {% if 'error' in message.tags %}Помилка{% elif 'warning' in message.tags %}Увага{% elif 'success' in message.tags %}Успішно{% else %}Інфо{% endif %}
              </span>
            </div>
            <div class="text-sm font-sans text-db-text leading-relaxed break-words">{{ message }}</div>
          </div>
        {% endfor %}
      </div>
    {% endif %}
  </noscript>
</div>
