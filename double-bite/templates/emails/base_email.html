<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Double Bite{% endblock %}</title>
<style>
body {
  margin: 0;
  padding: 0;
  background-color: #F6F6F6;
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  color: #262626;
  -webkit-font-smoothing: antialiased;
}
table {
  border-collapse: collapse;
}
.email-container {
  max-width: 600px;
  margin: 0 auto;
  background-color: #FFFFFF;
  border: 1px solid #E5E5E5;
}
.email-header {
  padding: 32px 32px 24px 32px;
  border-bottom: 1px solid #E5E5E5;
  text-align: center;
}
.brand-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: #262626;
  text-decoration: none;
  text-transform: uppercase;
}
.brand-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  color: #8C8C8C;
  text-transform: uppercase;
  margin-top: 4px;
}
.email-body {
  padding: 32px;
}
.email-footer {
  padding: 24px 32px;
  background-color: #F6F6F6;
  border-top: 1px solid #E5E5E5;
  text-align: center;
  font-size: 11px;
  color: #8C8C8C;
  line-height: 1.6;
}
.mono {
  font-family: 'JetBrains Mono', 'Courier New', monospace;
}
.btn-primary {
  display: inline-block;
  padding: 14px 28px;
  background-color: #262626;
  color: #FFFFFF !important;
  text-decoration: none;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
}
</style>
</head>
<body style="margin: 0; padding: 30px 15px; background-color: #F6F6F6;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #F6F6F6;">
<tr>
<td align="center">
<table role="presentation" class="email-container" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width: 600px; width: 100%; background-color: #FFFFFF; border: 1px solid #E5E5E5;">
<tr>
<td class="email-header" style="padding: 32px 32px 24px 32px; border-bottom: 1px solid #E5E5E5; text-align: center;">
<div class="brand-title" style="font-size: 22px; font-weight: 700; letter-spacing: -0.5px; color: #262626;">double bite™</div>
<div class="brand-sub" style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 2px; color: #8C8C8C; text-transform: uppercase; margin-top: 4px;">Haute Cuisine · Kyiv</div>
</td>
</tr>
<tr>
<td class="email-body" style="padding: 32px;">
{% block content %}{% endblock %}
</td>
</tr>
<tr>
<td class="email-footer" style="padding: 24px 32px; background-color: #F6F6F6; border-top: 1px solid #E5E5E5; text-align: center; font-size: 11px; color: #8C8C8C; line-height: 1.6;">
<div style="margin-bottom: 4px; font-weight: 600; color: #262626;">Double Bite</div>
<div style="margin-bottom: 4px;">вул. Володимирська, 42, Київ · Щодня 10:00–22:00</div>
<div style="margin-bottom: 8px;">Телефон турботи про гостей: <span class="mono">+380 44 123 45 67</span></div>
<div style="font-size: 10px; color: #A0A0A0; margin-bottom: 8px;">Це автоматичне системне повідомлення, будь ласка, не відповідайте на цей лист.</div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8C8C8C;">© 2026 Double Bite. Всі права захищено.</div>
</td>
</tr>
</table>
</td>
</tr>
</table>
</body>
</html>
