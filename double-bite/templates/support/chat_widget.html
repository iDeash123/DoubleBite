          htmx.ajax('GET', '{% url 'orders:cart_badge' %}', { target: '#cart-badge', swap: 'outerHTML' });
        }
        if (this.abortController === controller) {
          this.abortController = null;
          this.streamingAssistantKey = null;
          this.loading = false;
        }
        if (!escalatedInStream && this.shouldStreamSse() && !this.eventSource && !this.pollTimer) {
          this.startRealtime(false);
        }
        this.scrollToBottom();
      }
    },
    async sendOperatorMessage(query, existingUserMsg = null) {
      this.abortActivePoll();
      const msgKey = existingUserMsg && existingUserMsg._key
        ? existingUserMsg._key
        : ('tmp-' + (++this.msgKeySeq));
      if (!existingUserMsg) {
        this.messages.push({
          _key: msgKey,
          id: null,
          role: 'user',
          sender: 'user',
          content: query,
          created_at: '',
          error: '',
          showOperatorFallback: false,
          cartUpdated: false
        });
        this.input = '';
      }
      this.loading = true;
      this.scrollToBottom();

      const removeOptimistic = () => {
        const ownIdx = this.messages.findIndex(m => m._key === msgKey);
        if (ownIdx !== -1) this.messages.splice(ownIdx, 1);
      };

      try {
        const csrfToken = this.getCsrfToken();
        const res = await fetch('/support/chat/message/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrfToken
          },
          body: JSON.stringify({ message: query })
        });
        let data = null;
        try {
          data = await res.json();
        } catch (e) {}

        if (res.ok && data && data.message) {
          if (typeof data.is_working_hours === 'boolean') {
            this.isWorkingHours = data.is_working_hours;
          }
          if (data.working_hours_label) {
            this.workingHoursLabel = data.working_hours_label;
          }
          if (data.off_hours_notice) {
            this.offHoursNotice = data.off_hours_notice;
          }
          const dupIdx = this.messages.findIndex(m => m._key !== msgKey && m.id === data.message.id);
          if (dupIdx !== -1) {
            removeOptimistic();
          } else {
            const ownIdx = this.messages.findIndex(m => m._key === msgKey);
            if (ownIdx !== -1) {
              const target = this.messages[ownIdx];
              target.id = data.message.id;
              target.content = data.message.content;
              target.created_at = data.message.created_at || '';
            }
          }
          if (existingUserMsg) {
            await this.loadHistory();
          }
          if ((this.shouldStreamSse() || this.shouldPoll()) && !this.eventSource && !this.pollTimer) {
            this.startRealtime(false);
          }
        } else {
          removeOptimistic();
          if (res.status === 409 && data && data.status) {
            this.status = data.status;
            this.isEscalated = Boolean(data.is_escalated);
            if (!this.isEscalated) {
              this.operatorConnected = false;
              this.stopPolling();
            }
            if (data.status === 'ACTIVE') {
              this.input = query;
            }
            await this.loadHistory();
          } else {
            this.input = query;
            const errMsg = (data && data.error) || 'Не вдалося надіслати повідомлення. Спробуйте ще раз.';
            this.messages.push({
              _key: 'err-' + (++this.msgKeySeq),
              id: null,
              role: 'system',
              sender: 'system',
              content: '',
              created_at: '',
              error: errMsg,
              showOperatorFallback: false,
              cartUpdated: false
            });
            if ((this.shouldStreamSse() || this.shouldPoll()) && !this.eventSource && !this.pollTimer) {
              this.startRealtime(false);
            }
          }
        }
      } catch (e) {
        const confirmedIdx = this.messages.findIndex(m => m._key === msgKey && m.id);
        if (confirmedIdx === -1) {
          removeOptimistic();
          this.input = query;
          this.messages.push({
            _key: 'err-' + (++this.msgKeySeq),
            id: null,
            role: 'system',
            sender: 'system',
            content: '',
            created_at: '',
            error: 'Помилка мережі. Перевірте зʼєднання та спробуйте ще раз.',
            showOperatorFallback: false,
            cartUpdated: false
          });
        }
        if ((this.shouldStreamSse() || this.shouldPoll()) && !this.eventSource && !this.pollTimer) {
          this.startRealtime(false);
        }
      } finally {
        this.loading = false;
        this.scrollToBottom();
      }
    },
    async escalateToOperator(reason = 'HUMAN_REQUESTED', details = '') {
      if (this.loading || this.escalating || this.resetting || this.isEscalated || this.isResolved) return;
      this.abortActiveStream();
      this.stopRealtime();
      this.sseClosedErrors = 0;
      this.escalating = true;
      try {
        const csrfToken = this.getCsrfToken();
        const res = await fetch('/support/chat/escalate/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrfToken
          },
          body: JSON.stringify({ reason, details })
        });
        let data = null;
        try {
          data = await res.json();
        } catch (e) {}
        if (res.ok && data) {
          this.lastHistorySyncAt = Date.now();
          this.applySessionState(data, true);
          if (Array.isArray(data.messages) && data.messages.length > 0) {
            this.messages = data.messages.map(m => this.normalizeMessage(m));
          }
          if (this.shouldStreamSse() || this.shouldPoll()) {
            this.startRealtime(false);
          }
          this.scrollToBottom();
        } else if (res.status === 409 && data && data.status) {
          this.status = data.status;
          this.isEscalated = Boolean(data.is_escalated);
          await this.loadHistory();
        } else {
          const errMsg = (data && data.error) || 'Не вдалося викликати оператора. Спробуйте ще раз.';
          this.messages.push({
            _key: 'err-' + (++this.msgKeySeq),
            id: null,
            role: 'system',
            sender: 'system',
            content: '',
            created_at: '',
            error: errMsg,
            showOperatorFallback: false,
            cartUpdated: false
          });
          if (this.shouldStreamSse()) {
            this.startRealtime(false);
          }
          this.scrollToBottom();
        }
      } catch (e) {
        this.messages.push({
          _key: 'err-' + (++this.msgKeySeq),
          id: null,
          role: 'system',
          sender: 'system',
          content: '',
          created_at: '',
          error: 'Помилка мережі під час виклику оператора. Спробуйте ще раз.',
          showOperatorFallback: false,
          cartUpdated: false
        });
        if (this.shouldStreamSse()) {
          this.startRealtime(false);
        }
        this.scrollToBottom();
      } finally {
        this.escalating = false;
      }
    },
    requestResetChat() {
      if (this.resetting) return;
      if (this.isEscalated && !this.isResolved) {
        this.confirmResetOpen = true;
        return;
      }
      this.resetChat();
    },
    async resetChat() {
      if (this.resetting) return;
      this.resetting = true;
      this.confirmResetOpen = false;
      this.stopRealtime();
      this.abortActiveStream();
      try {
        const csrfToken = this.getCsrfToken();
        const res = await fetch('/support/chat/reset/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrfToken
          }
        });
        let data = null;
        try {
          data = await res.json();
        } catch (e) {}
        if (res.ok && data) {
          this.sessionUuid = data.session_uuid || null;
          this.status = 'ACTIVE';
          this.isEscalated = false;
          this.operatorConnected = false;
          this.lastMessageId = 0;
          this.sseClosedErrors = 0;
          this.lastHistorySyncAt = Date.now();
          this.messages = [
            this.makeWelcomeMsg('Контекст діалогу очищено. Чим я можу вам допомогти сьогодні?')
          ];
          if (this.shouldStreamSse()) {
            this.startRealtime(false);
          }
          this.scrollToBottom();
        } else {
          const errMsg = (data && data.error) || 'Не вдалося почати новий діалог. Спробуйте ще раз.';
          this.messages.push({
            _key: 'err-' + (++this.msgKeySeq),
            id: null,
            role: 'system',
            sender: 'system',
            content: '',
            created_at: '',
            error: errMsg,
            showOperatorFallback: false,
            cartUpdated: false
          });
          if (this.shouldStreamSse() || this.shouldPoll()) {
            this.startRealtime(false);
          }
          this.scrollToBottom();
        }
      } catch (e) {
        this.messages.push({
          _key: 'err-' + (++this.msgKeySeq),
          id: null,
          role: 'system',
          sender: 'system',
          content: '',
          created_at: '',
          error: 'Помилка мережі. Не вдалося почати новий діалог.',
          showOperatorFallback: false,
          cartUpdated: false
        });
        if (this.shouldStreamSse() || this.shouldPoll()) {
          this.startRealtime(false);
        }
        this.scrollToBottom();
      } finally {
        this.resetting = false;
      }
    },
    async pollHistory() {
      if (!this.shouldPoll() || this.sseConnected) {
        this.stopPolling();
        return;
      }
      if (this.pollingInFlight || this.loading || this.escalating || this.resetting) {
        this.scheduleNextPoll();
        return;
      }
      const controller = new AbortController();
      this.pollAbortController = controller;
      this.pollingInFlight = true;
      let aborted = false;
      try {
        const url = '/support/chat/history/?after_id=' + encodeURIComponent(String(this.lastMessageId || 0));
        const res = await fetch(url, { cache: 'no-store', signal: controller.signal });
        if (res.ok) {
          const data = await res.json();
          this.lastHistorySyncAt = Date.now();
          if (this.sessionUuid && data.session_uuid && data.session_uuid !== this.sessionUuid) {
            this.pollingInFlight = false;
            this.pollAbortController = null;
            await this.loadHistory();
            return;
          }
          this.applySessionState(data, false);
          if (Array.isArray(data.messages) && data.messages.length > 0) {
            let added = false;
            for (const incoming of data.messages) {
              if (this.mergeIncomingMessage(incoming)) {
                added = true;
              }
            }
            if (added) {
              this.scrollToBottom();
            }
          }
        }
      } catch (e) {
        if (e && e.name === 'AbortError') {
          aborted = true;
          return;
        }
      } finally {
        if (this.pollAbortController === controller) {
          this.pollAbortController = null;
          this.pollingInFlight = false;
        }
        if (!aborted && !controller.signal.aborted && !this.sseConnected) {
          this.scheduleNextPoll();
        }
      }
    }
  }"

                : (msg.sender === 'operator'
                  ? 'bg-emerald-50 text-db-text border border-emerald-200 px-3.5 py-2.5 text-[13px] font-sans leading-relaxed max-w-[85%] rounded-2xl rounded-bl-sm'
                  : 'bg-db-boucle text-db-text px-3.5 py-2.5 text-[13px] font-sans leading-relaxed max-w-[85%] rounded-2xl rounded-bl-sm'))"
          >
            <div
              :class="msg.sender === 'user' ? 'text-white/65 justify-end' : 'text-db-subtle justify-between'"
              class="flex items-center gap-2 text-[11px] font-sans font-medium mb-1"
            >
              <span x-text="msg.sender === 'user' ? 'Ви' : (msg.sender === 'operator' ? 'Адміністратор ресторану' : (msg.sender === 'system' ? 'Система' : 'Double Bite Консьєрж'))"></span>
              <span x-show="msg.created_at" class="font-mono text-[10px] tabular-nums" x-text="msg.created_at"></span>
            </div>
            <div x-show="msg.content" class="whitespace-pre-wrap break-words" x-effect="$el.innerHTML = window.__formatMarkdown(msg.content)"></div>
            <div x-show="msg.error" :class="msg.content ? 'mt-2' : ''" class="p-2.5 rounded-lg bg-red-50 border border-red-200 text-red-800 text-xs font-sans whitespace-pre-wrap">
              <div x-text="msg.error"></div>
              <div x-show="!isEscalated && !isResolved && msg.showOperatorFallback" class="mt-2 pt-2 border-t border-red-200">
                <button
                  type="button"
                  @click="escalateToOperator('HUMAN_REQUESTED', 'Клієнт викликав оператора після помилки AI-асистента.')"
                  :disabled="escalating || loading || resetting"
                  class="min-h-[44px] px-3 py-1.5 rounded-lg bg-db-noir text-white hover:bg-db-ink text-xs font-sans font-medium transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
                >
                  Покликати оператора
                </button>
              </div>
            </div>
            <div x-show="msg.cartUpdated" class="mt-2.5 pt-2.5 border-t border-db-linen">
              <button
                type="button"
                @click="window.dispatchEvent(new CustomEvent('open-cart-drawer'))"
                class="min-h-[44px] px-3 py-1.5 rounded-lg bg-db-noir text-white hover:bg-db-ink text-xs font-sans font-medium transition-colors cursor-pointer"
              >
                Відкрити кошик
              </button>
            </div>
          </div>
        </div>
      </template>
      <div x-show="loading && !isEscalated" class="flex justify-start" aria-live="polite">
        <div class="inline-flex items-center gap-2.5 px-3.5 py-2.5 rounded-2xl rounded-bl-sm bg-db-boucle text-db-muted text-xs font-sans">
          <span class="inline-flex items-center gap-1" aria-hidden="true">
            <span class="w-1.5 h-1.5 rounded-full bg-db-crust-dark animate-bounce motion-reduce:animate-none [animation-delay:-0.3s]"></span>
            <span class="w-1.5 h-1.5 rounded-full bg-db-crust-dark animate-bounce motion-reduce:animate-none [animation-delay:-0.15s]"></span>
            <span class="w-1.5 h-1.5 rounded-full bg-db-crust-dark animate-bounce motion-reduce:animate-none"></span>
          </span>
          <span>Консьєрж формує відповідь…</span>
        </div>
      </div>
    </div>

    <form x-show="!isResolved" @submit.prevent="sendMessage()" class="p-3 border-t border-db-linen bg-db-paper flex items-center gap-2">
      <input
        type="text"
        x-model="input"
        maxlength="2000"
        :disabled="loading || escalating || resetting || isResolved"
        :placeholder="isEscalated ? 'Напишіть адміністратору…' : 'Запитайте про меню…'"
        :aria-label="isEscalated ? 'Повідомлення для адміністратора' : 'Повідомлення для AI-консьєржа'"
        class="flex-1 min-w-0 min-h-[44px] px-3.5 py-2 text-base sm:text-sm font-sans bg-white border border-db-linen text-db-text placeholder:text-db-subtle focus:outline-none focus:border-db-crust-dark focus:ring-2 focus:ring-db-crust/20 rounded-xl transition-colors disabled:bg-db-boucle disabled:cursor-not-allowed"
      >
      <button
        type="submit"
        :disabled="loading || escalating || resetting || isResolved"
        class="min-h-[44px] px-4 py-2 bg-db-noir text-white hover:bg-db-ink text-sm font-sans font-medium transition-colors rounded-xl whitespace-nowrap cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed shrink-0"
      >
        Надіслати
      </button>
    </form>

    <div x-show="isResolved" x-cloak class="p-3 border-t border-db-linen bg-db-paper flex flex-col gap-2">
      <p class="text-xs font-sans text-db-muted text-center">
        Діалог завершено. Якщо виникнуть нові запитання — почніть новий діалог.
      </p>
      <button
        type="button"
        @click="resetChat()"
        :disabled="resetting"
        class="w-full min-h-[44px] px-4 py-2 bg-db-noir text-white hover:bg-db-ink text-sm font-sans font-medium transition-colors rounded-xl cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Почати новий діалог
      </button>
    </div>
  </div>
</div>
