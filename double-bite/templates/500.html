<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тимчасова помилка сервера (500) — Double Bite™</title>
  <meta name="theme-color" content="#FAF8F5">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #FAF8F5;
      color: #1F1C19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    header {
      border-bottom: 1px solid #E6E0D6;
      background-color: #FAF8F5;
    }
    .header-inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 24px;
      height: 68px;
      display: flex;
      align-items: center;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #24211E;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.02em;
    }
    .brand svg { color: #A65622; }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
    }
    .card {
      width: 100%;
      max-width: 540px;
      background-color: #FFFFFF;
      border: 1px solid #E6E0D6;
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 1px 2px rgba(20, 19, 18, 0.04);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 9999px;
      background-color: #F3EFE8;
      color: #A65622;
      margin-bottom: 24px;
    }
    .code {
      margin: 0 0 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #A65622;
    }
    h1 {
      margin: 0 0 16px;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 500;
      font-size: 32px;
      line-height: 1.15;
      color: #1F1C19;
    }
    p {
      margin: 0 0 28px;
      font-size: 15px;
      line-height: 1.6;
      color: #57524C;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: background-color 150ms ease, border-color 150ms ease;
    }
    .btn-primary {
      background-color: #24211E;
      color: #FFFFFF;
    }
    .btn-primary:hover { background-color: #141312; }
    .btn-secondary {
      background-color: #FFFFFF;
      color: #1F1C19;
      border: 1px solid #E6E0D6;
    }
    .btn-secondary:hover { border-color: #24211E; }
    footer {
      border-top: 1px solid #E6E0D6;
      padding: 20px 24px;
      text-align: center;
      font-size: 12px;
      color: #6E6861;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="/" class="brand">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path d="M18.28 13.53 A9 9 0 1 1 13.38 1.66 A4.2 4.2 0 0 0 17.72 7.57 A3.4 3.4 0 0 0 18.28 13.53 Z"/>
        </svg>
        <span>double bite™</span>
      </a>
    </div>
  </header>

  <main>
    <section class="card" aria-labelledby="error-500-heading">
      <div class="badge" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 20 20" fill="currentColor">
          <path d="M18.28 13.53 A9 9 0 1 1 13.38 1.66 A4.2 4.2 0 0 0 17.72 7.57 A3.4 3.4 0 0 0 18.28 13.53 Z"/>
        </svg>
      </div>
      <p class="code">Помилка 500</p>
      <h1 id="error-500-heading">Щось пішло не так</h1>
      <p>
        На стороні сервера виникла тимчасова технічна помилка. Наша команда вже працює над її усуненням — спробуйте оновити сторінку за кілька хвилин або поверніться до меню.
      </p>
      <div class="actions">
        <a href="/" class="btn btn-primary">На головну</a>
        <a href="/menu/" class="btn btn-secondary">Перейти до меню</a>
      </div>
    </section>
  </main>

  <footer>
    © 2026 Double Bite™ · Київ
  </footer>
</body>
</html>
