<script>
function heroShowcase(initialDishes) {
  return {
    currentIndex: 0,
    prevIndex: -1,
    paused: false,
    hovering: false,
    offscreen: false,
    origin: { x: 72, y: 50 },
    dishes: initialDishes && initialDishes.length ? initialDishes : [
      {
        id: 1,
        title: 'Truffle Wagyu Burger',
        subtitle: 'Бріош · Мармурова яловичина · Трюфельний айолі',
        tag: '01 · HAUTE BURGER',
        badge: 'ФЛАГМАНСЬКА СТРАВА',
        description: 'Фірмовий бургер з витриманою мармуровою яловичиною сухого визрівання, соусом з чорного трюфеля, карамелізованою цибулею та вершковим чедером у свіжоспеченій булочці бріош.',
        taste_notes: 'Насичений умамі, земляні ноти чорного трюфеля, соковита мармурова текстура',
        price: '485',
        weight_grams: 380,
        calories: 680,
        prep_time: '15 хв',
        image: '/static/images/showcase/photo-1568901346375-23c9450c58cd.webp',
        bg_watermark: 'HAUTE BURGER'
      },
      {
        id: 2,
        title: 'Quattro Formaggi al Tartufo',
        subtitle: 'Горгонзола · Fior di Latte · Пармезан 24 міс. · Трюфельний мед',
        tag: '02 · NEAPOLITAN PIZZA',
        badge: '48H FERMENTATION',
        description: 'Біла неаполітанська піца на повітряному тісті 48-годинної холодної ферментації з чотирма витриманими сирами та акацієвим медом з білим трюфелем.',
        taste_notes: 'Вершково-пікантний контраст, медово-трюфельний посмак, хрусткий бортик',
        price: '420',
        weight_grams: 460,
        calories: 820,
        prep_time: '12 хв',
        image: '/static/images/showcase/photo-1513104890138-7c749659a591.webp',
        bg_watermark: 'NEAPOLITAN PIZZA'
      },
      {
        id: 3,
        title: 'Wild Salmon & Avocado Bowl',
        subtitle: 'Норвезький лосось · Авокадо Hass · Кіноа · Едамаме',
        tag: '03 · FRESH BOWL',
        badge: 'HEALTHY FLOW',
        description: 'Збалансований боул з охолодженим норвезьким лососем, стиглим кремовим авокадо Hass, органічною кіноа, бобами едамаме та цитрусово-кунжутною заправкою.',
        taste_notes: 'Свіжий океанічний смак, оксамитова ніжність авокадо, хрусткі нутрієнти',
        price: '390',
        weight_grams: 340,
        calories: 420,
        prep_time: '10 хв',
        image: '/static/images/showcase/photo-1546069901-ba9599a7e63c.webp',
        bg_watermark: 'FRESH BOWL'
      },
      {
        id: 4,
        title: 'Basque Burnt Cheesecake',
        subtitle: 'Карамелізована скоринка · Ваніль Bourbon · Тануча серцевина',
        tag: '04 · CRAFT PASTRY',
        badge: 'CHEF SIGNATURE',
        description: 'Легендарний сан-себастьянський чізкейк з випаленою до гірко-солодкого карамельного відтінку поверхнею та оксамитовою рідкою текстурою в середині.',
        taste_notes: 'Карамелізована скоринка, тануча вершкова ніжність, бурбонська мадагаскарська ваніль',
        price: '220',
        weight_grams: 190,
        calories: 340,
        prep_time: '5 хв',
        image: '/static/images/showcase/photo-1533134242443-d4fd215305ad.webp',
        bg_watermark: 'BURNT CHEESECAKE'
      }
    ],
    get currentDish() {
      return this.dishes[this.currentIndex] || this.dishes[0];
    },
    get titleWords() {
      return (this.currentDish.title || '').split(' ');
    },
    pad(n) {
      return (n < 10 ? '0' : '') + n;
    },
    init() {
      var self = this;
      if ('IntersectionObserver' in window) {
        new IntersectionObserver(function (entries) {
          self.offscreen = !entries[0].isIntersecting;
          self.syncPause();
        }, { threshold: 0.25 }).observe(this.$el);
      }
    },
    syncPause() {
      this.paused = this.hovering || this.offscreen;
    },
    setHover(state) {
      this.hovering = state;
      this.syncPause();
    },
    originFrom(index) {
      var rail = this.$refs.rail;
      var btn = rail ? rail.querySelectorAll('[data-rail-item]')[index] : null;
      if (!btn) return { x: 72, y: 50 };
      var heroRect = this.$el.getBoundingClientRect();
      var r = btn.getBoundingClientRect();
      return {
        x: ((r.left + r.width / 2 - heroRect.left) / heroRect.width) * 100,
        y: ((r.top + r.height / 2 - heroRect.top) / heroRect.height) * 100
      };
    },
    selectDish(index) {
      if (index === this.currentIndex) return;
      this.origin = this.originFrom(index);
      this.prevIndex = this.currentIndex;
      this.currentIndex = index;
    },
    next() {
      this.selectDish((this.currentIndex + 1) % this.dishes.length);
    },
    onMouseMove(event) {
      var rect = this.$el.getBoundingClientRect();
      var nx = (event.clientX - rect.left) / rect.width;
      var ny = (event.clientY - rect.top) / rect.height;
      var stage = this.$refs.stage;
      if (!stage) return;
      stage.style.setProperty('--px', ((0.5 - nx) * 24).toFixed(1) + 'px');
      stage.style.setProperty('--py', ((0.5 - ny) * 16).toFixed(1) + 'px');
      stage.style.setProperty('--mx', (nx * 100).toFixed(1) + '%');
      stage.style.setProperty('--my', (ny * 100).toFixed(1) + '%');
    },
    resetTilt() {
      var stage = this.$refs.stage;
      if (!stage) return;
      stage.style.setProperty('--px', '0px');
      stage.style.setProperty('--py', '0px');
    },
    addToCart(dish) {
      if (!dish) return;
      const dishId = dish.id;
      if (dishId && dishId > 0) {
        if (window.htmx) {
          htmx.ajax('POST', '/cart/add/' + dishId + '/', {
            target: '#cart-badge',
            swap: 'outerHTML'
          });
        }
      } else {
        window.dispatchEvent(new CustomEvent('open-cart-drawer'));
      }
      if (window.showToast) {
        window.showToast('«' + (dish.title || 'Страву') + '» додано до замовлення', 'success');
      }
    },
    askAiConcierge(dish) {
      const title = dish && dish.title ? dish.title : 'фірмові страви';
      const query = 'Розкажи про особливості приготування ' + title + ' та що до неї пасує?';
      window.dispatchEvent(new CustomEvent('open-ai-chat', {
        detail: { query: query }
      }));
    }
  };
}
</script>

<section
  id="hero-showcase"
  class="db-hero"
  x-data="heroShowcase({{ hero_dishes_json|default:'[]' }})"
  :class="{ 'is-paused': paused }"
  style="--db-autoplay: 7s"
  @mousemove="onMouseMove($event)"
  @mouseleave="resetTilt()"
  aria-roledescription="carousel"
  aria-label="Фірмові страви Double Bite"
>
  <div class="db-hero__stage" x-ref="stage" :style="'--ox:' + origin.x + '%;--oy:' + origin.y + '%'">
    <template x-for="(dish, idx) in dishes" :key="'slide-' + idx">
      <div class="db-hero__slide" :class="{ 'is-active': idx === currentIndex, 'is-prev': idx === prevIndex }" :aria-hidden="idx !== currentIndex">
        <img class="db-hero__img" :src="dish.image" :alt="dish.title" width="1600" height="1000" :loading="idx === 0 ? 'eager' : 'lazy'" decoding="async">
      </div>
    </template>
    <div class="db-hero__shade"></div>
    <div class="db-hero__spot"></div>
    <div class="db-hero__grain"></div>
  </div>

  <div class="db-hero__index" aria-hidden="true">
    <span class="db-hero__index-roll">
      <span class="db-hero__index-track" :style="'transform: translateY(-' + (currentIndex * 0.8) + 'em)'">
        <template x-for="(dish, idx) in dishes" :key="'num-' + idx">
          <span x-text="pad(idx + 1)"></span>
        </template>
      </span>
    </span>
    <small x-text="'/' + pad(dishes.length)"></small>
  </div>

  <div class="db-hero__body">
    <div class="db-wrap db-hero__inner">

      <div class="db-hero__top">
        <h1 class="db-hero__h1"><b>Double Bite</b> — авторські бургери, неаполітанська піца, боули та десерти з доставкою по Києву</h1>
        <span class="db-hero__status"><span class="db-pulse"></span>Приймаємо замовлення · 10:00 — 22:00</span>
      </div>

      <div class="db-hero__content" @mouseenter="setHover(true)" @mouseleave="setHover(false)" @focusin="setHover(true)" @focusout="setHover(false)">
        <template x-for="dish in [currentDish]" :key="'content-' + currentIndex">
          <div aria-live="polite">
            <span class="db-kicker db-hero__tag db-fade-in">
              <svg class="db-bite" aria-hidden="true"><use href="#db-bite"></use></svg>
              <span x-text="dish.tag + ' · ' + dish.badge"></span>
            </span>

            <h2 class="db-hero__title">
              <template x-for="(word, wi) in titleWords" :key="currentIndex + '-' + wi">
                <span class="w"><span :style="'animation-delay:' + (0.12 + wi * 0.08) + 's'" x-text="word"></span></span>
              </template>
            </h2>

            <p class="db-hero__sub db-fade-in" style="animation-delay:.35s" x-text="dish.subtitle"></p>
            <p class="db-hero__desc db-fade-in" style="animation-delay:.45s" x-text="dish.description"></p>

            <dl class="db-hero__passport db-fade-in" style="animation-delay:.55s">
              <div><dt>Вартість</dt><dd class="is-price" x-text="dish.price + ' ₴'"></dd></div>
              <div><dt>Вага</dt><dd x-text="dish.weight_grams + ' г'"></dd></div>
              <div><dt>Енергія</dt><dd x-text="dish.calories + ' ккал'"></dd></div>
              <div><dt>Час подачі</dt><dd x-text="dish.prep_time"></dd></div>
            </dl>
          </div>
        </template>

        <div class="db-hero__actions">
          <button type="button" id="hero-quick-add-btn" class="db-btn db-btn--light" @click="addToCart(currentDish)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            <span>Додати до замовлення</span>
            <span class="db-btn__price" x-text="currentDish.price + ' ₴'"></span>
          </button>
          <a href="/menu/" class="db-btn db-btn--ghost-dark">Відкрити меню</a>
        </div>
        <button type="button" id="hero-ai-consult-btn" class="db-link db-hero__ai" @click="askAiConcierge(currentDish)">
          <span class="db-pulse"></span>
          <span class="db-link__label">Запитати AI-консьєржа про страву</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </div>
    </div>

    <div class="db-hero__rail" @mouseenter="setHover(true)" @mouseleave="setHover(false)">
      <div class="db-wrap">
        <div class="db-hero__rail-grid" x-ref="rail" role="tablist" aria-label="Оберіть страву">
          <template x-for="(dish, idx) in dishes" :key="'rail-' + idx">
            <button
              type="button"
              role="tab"
              data-rail-item
              class="db-rail-item"
              :class="{ 'is-active': idx === currentIndex }"
              :aria-selected="idx === currentIndex"
              @click="selectDish(idx)"
            >
              <span class="db-rail-item__bar" aria-hidden="true"><i @animationend="idx === currentIndex && next()"></i></span>
              <span class="db-rail-item__thumb"><img :src="dish.image" alt="" width="56" height="56" loading="lazy"></span>
              <span class="db-rail-item__meta">
                <span class="db-rail-item__tag" x-text="dish.tag"></span>
                <span class="db-rail-item__title" x-text="dish.title"></span>
                <span class="db-rail-item__price" x-text="dish.price + ' ₴ · ' + dish.prep_time"></span>
              </span>
            </button>
          </template>
        </div>
      </div>
    </div>
  </div>
</section>
