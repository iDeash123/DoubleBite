            <span class="db-coll-tab__title" x-text="col.title"></span>
            <svg class="db-coll-tab__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>

        </template>
      </nav>

        <template x-for="col in [currentCollection]" :key="'panel-' + activeCollectionIndex">
          <div>
            <div class="db-coll-intro db-swap">
              <div>

                    <img :src="dish.image" :alt="dish.title" width="600" height="750" loading="lazy" decoding="async">
                    <span class="db-dish__price" x-text="dish.price + ' ₴'"></span>
